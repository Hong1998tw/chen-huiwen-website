name: Monthly lawyer calendar candidate build
on:
  pull_request:
permissions:
  contents: read
jobs:
  generate:
    if: github.head_ref == 'feat/monthly-lawyer-calendar-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.5 html5lib==1.1
      - run: python scripts/build_all.py
      - name: Verify and package generated text only
        run: |
          python scripts/quality.py
          python - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('.')
          paths=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed=lambda p: p.endswith('.html') or p in ('admin/public/legal-calendar.js','admin/public/legal-calendar.css','data/search-index.json','data/achievement-map.json','data/achievements-public.json','sitemap.xml','updates.xml','site.js')
          assert all(allowed(p) for p in paths),paths
          output={p:(root/p).read_text() for p in paths}
          pathlib.Path('/tmp/monthly-generated.json').write_text(json.dumps(output,ensure_ascii=False))
          print(json.dumps({'count':len(paths),'paths':paths}))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monthly-generated
          path: /tmp/monthly-generated.json
          retention-days: 7
