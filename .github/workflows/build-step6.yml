name: Build Step 6 generated outputs

on:
  push:
    branches:
      - chore/achievement-audit-foundation
    paths:
      - .github/workflows/build-step6.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: chore/achievement-audit-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install beautifulsoup4 html5lib pillow
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Validate source before build
        run: |
          python -m json.tool data/achievements.json > /dev/null
          python -m json.tool data/villages.json > /dev/null
          python scripts/validate_achievements.py --baseline-ref origin/main
          python -m unittest discover -s tests -p 'test_achievement*.py'

      - name: Build cases search sitemap and OG
        run: |
          python scripts/build_cases.py
          python scripts/build_search.py
          python scripts/build_share_cards.py --font /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

      - name: Verify Step 6 scope
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('.')
          base=json.loads(subprocess.check_output(['git','show','origin/main:data/achievements.json'],text=True))
          cur=json.loads((root/'data/achievements.json').read_text())
          all_ids=lambda rows:{x['id'] for x in rows}
          pub=lambda rows:{x['id'] for x in rows if x['status']!='待核驗'}
          new_records=sorted(all_ids(cur)-all_ids(base))
          new_public=sorted(pub(cur)-pub(base))
          assert len(new_records)==12, f'Expected 12 new source records, got {len(new_records)}: {new_records}'
          assert len(new_public)==13, f'Expected 13 newly generated public detail pages, got {len(new_public)}: {new_public}'
          assert 'gaofeng-drain' in all_ids(base) and 'gaofeng-drain' in new_public, 'gaofeng-drain should be an existing stable ID promoted from non-public to public'
          missing=[aid for aid in new_public if not (root/f'achievement-{aid}.html').exists()]
          assert not missing, f'Missing generated detail pages: {missing}'
          expected_existing_updates={'guangfu-drainage','mingfeng-12-gongyuan-road'}
          assert expected_existing_updates <= pub(base) & pub(cur), 'Expected existing public update IDs missing'
          sitemap=(root/'sitemap.xml').read_text()
          missing_urls=[aid for aid in new_public if f'https://www.huiwen.tw/achievement-{aid}.html' not in sitemap]
          assert not missing_urls, f'Missing sitemap URLs: {missing_urls}'
          print('Step 6 scope verified: 12 new source records; 13 new public detail pages including promoted gaofeng-drain; 2 existing public detail pages updated; sitemap synchronized')
          PY

      - name: Validate generated public site
        run: |
          python scripts/validate_site.py
          python scripts/validate_seo.py
          python scripts/validate_p0.py
          python scripts/validate_public_copy.py
          git diff --check

      - name: Commit generated outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add achievements.html 'achievement-'*.html data/search-index.json sitemap.xml assets/og
          if git diff --cached --quiet; then
            echo 'No generated output change produced.'
            exit 1
          fi
          git commit -m "build: regenerate achievement pages search sitemap and OG"

      - name: Verify deterministic rebuild
        run: |
          python scripts/build_cases.py
          python scripts/build_search.py
          python scripts/build_share_cards.py --font /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          git diff --exit-code

      - name: Push generated build
        run: git push origin HEAD:chore/achievement-audit-foundation
