name: Homepage production design QA
on:
  pull_request:
permissions:
  contents: read
jobs:
  homepage-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.5 html5lib==1.1 'fonttools[woff]==4.66.1'
      - run: python scripts/build_all.py
      - name: Preserve generated source evidence
        run: |
          mkdir -p /tmp/home-generated
          git diff --name-only -- '*.html' 'data/*.json' 'sitemap.xml' 'updates.xml' > /tmp/home-generated/changed-files.txt
          python - <<'PY'
          from pathlib import Path
          import json, shutil, subprocess
          out=Path('/tmp/home-generated')
          changed=(out/'changed-files.txt').read_text().splitlines()
          for name in subprocess.check_output(['git','ls-files','--others','--exclude-standard','--','*.html'],text=True).splitlines():
              if '/' not in name and name not in changed: changed.append(name)
          (out/'changed-files.txt').write_text('\n'.join(changed)+'\n')
          for name in changed:
              target=out/name
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(name,target)
          (out/'manifest.json').write_text(json.dumps({'changed':changed},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-generated-evidence
          path: /tmp/home-generated/
          retention-days: 14
      - run: python -m unittest discover -s tests -p test_home_projection.py
      - run: npm ci --ignore-scripts --prefix tests/donation
      - run: npx --prefix tests/donation playwright install --with-deps chromium
      - run: node tests/donation/homepage-production.mjs
      - name: Require committed generated outputs
        run: |
          git diff --exit-code -- '*.html' 'data/*.json' 'sitemap.xml' 'updates.xml'
          test -z "$(git ls-files --others --exclude-standard -- '*.html')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: homepage-production-design
          path: tests/donation/results/homepage-production/
          retention-days: 14
