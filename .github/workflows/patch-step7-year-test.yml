name: Patch Step 7 year filter regression test

on:
  push:
    branches:
      - chore/achievement-audit-foundation
    paths:
      - .github/workflows/patch-step7-year-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/achievement-audit-foundation
          fetch-depth: 0
      - name: Patch hard-coded year counts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/donation/p0.mjs')
          lines = p.read_text().splitlines()
          found_2013 = found_undated = False
          for i, line in enumerate(lines):
              if "selectOption('2013');await count(1)" in line:
                  lines[i] = "  const runtime=await page.evaluate(()=>window.HuiwenCases.getState().data.map(c=>({id:c.id,years:c.years}))); const in2013=runtime.filter(c=>c.years.includes('2013')); await page.locator('#year-filter').selectOption('2013'); await count(in2013.length); assert.deepEqual(await page.evaluate(()=>window.HuiwenCases.getState().visible.map(c=>c.id)),in2013.map(c=>c.id));"
                  found_2013 = True
              if "selectOption('undated');await count(3)" in line:
                  lines[i] = "  const undated=runtime.filter(c=>c.years.length===0); await page.locator('#year-filter').selectOption('undated'); await count(undated.length); assert.deepEqual(await page.evaluate(()=>window.HuiwenCases.getState().visible.map(c=>c.id)),undated.map(c=>c.id)); await page.locator('#reset-map-filters').click();"
                  found_undated = True
          if not (found_2013 and found_undated):
              raise SystemExit('Expected hard-coded year lines not found')
          p.write_text('\n'.join(lines)+'\n')
          PY
          node --check tests/donation/p0.mjs
          grep -F "const runtime=await page.evaluate" tests/donation/p0.mjs
      - name: Commit test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/donation/p0.mjs
          git commit -m "test: derive P0 year filter expectations from map runtime"
          git push origin HEAD:chore/achievement-audit-foundation
