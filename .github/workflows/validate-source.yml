name: Validate canonical source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@895211ea93a7a22cadc87f89f19b1c5aa8a8f005 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@345dd9cbd9c0a64e9c34613006d647e3a2c70cb5 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install beautifulsoup4 html5lib

      - name: Validate achievements JSON
        run: |
          python -m json.tool data/achievements.json > /dev/null
          python -m json.tool data/villages.json > /dev/null
          python scripts/validate_achievements.py

      - name: Preserve stable achievement IDs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_achievements.py --baseline-ref "$BASE_SHA"

      - name: Test achievement governance without private inputs
        run: |
          python -m unittest discover -s tests -p 'test_achievement*.py'
          python scripts/audit_achievement_coverage.py --help

      - name: Rebuild generated public pages
        run: |
          python scripts/build_cases.py
          python scripts/build_platforms.py
          python scripts/build_events.py
          python scripts/build_search.py

      - name: Ensure generated files are committed
        run: git diff --exit-code

      - name: Validate site integrity
        run: python scripts/validate_site.py

      - name: Validate political donation page
        run: python scripts/validate_donation.py

      - name: Validate SEO contract
        run: python scripts/validate_seo.py

      - name: Validate P0 search and share cards
        run: python scripts/validate_p0.py

      - name: Validate public-facing copy
        run: python scripts/validate_public_copy.py

      - name: Validate domain migration candidate when present
        shell: bash
        run: |
          if test -f data/seo/legacy-urls.csv && test -f data/seo/redirect-map.csv && test -f scripts/validate_domain_migration.py; then
            python scripts/validate_domain_migration.py
          else
            echo 'Domain migration candidate files are not present on this branch; skipping migration-only validator.'
          fi

      - name: Run SEO regression tests
        run: python -m unittest tests/test_validate_seo.py

      - name: Reject deployment placeholders in deployable source
        shell: bash
        run: |
          if grep -RInE 'YOUR_GITHUB_USERNAME|YOUR_REPOSITORY_NAME' \
            --include='*.html' --include='*.js' --include='*.json' \
            --exclude-dir='.git' .; then
            echo 'Deployment placeholder found in deployable source.'
            exit 1
          fi

      - name: Check required canonical-source files
        shell: bash
        run: |
          test -f data/achievements.json
          test -f scripts/build_cases.py
          test -f templates/case-page.html
          test -f scripts/validate_public_copy.py
          test -f docs/CANONICAL-SOURCE.md
          test -f docs/DEPLOYMENT.md
          test -f docs/TEST-CHECKLIST.md
          test -f docs/CONTENT-SOURCES.md
