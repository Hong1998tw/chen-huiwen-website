name: Validate canonical source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install beautifulsoup4==4.13.5 html5lib==1.1

      - name: Run deterministic quality and negative fixtures
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if test -n "$BASE_SHA"; then
            python scripts/quality.py --baseline-ref "$BASE_SHA"
          else
            python scripts/quality.py
          fi

      - name: Reject deployment placeholders in deployable source
        shell: bash
        run: |
          if grep -RInE 'YOUR_GITHUB_USERNAME|YOUR_REPOSITORY_NAME' \
            --include='*.html' --include='*.js' --include='*.json' \
            --exclude-dir='.git' .; then
            echo 'Deployment placeholder found in deployable source.'
            exit 1
          fi

      - name: Check required canonical-source files
        shell: bash
        run: |
          test -f data/achievements.json
          test -f scripts/build_cases.py
          test -f templates/case-page.html
          test -f scripts/validate_public_copy.py
          test -f docs/CANONICAL-SOURCE.md
          test -f docs/DEPLOYMENT.md
          test -f docs/TEST-CHECKLIST.md
          test -f docs/CONTENT-SOURCES.md
