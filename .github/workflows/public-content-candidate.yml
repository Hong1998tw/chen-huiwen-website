name: Public content candidate generation
on:
  pull_request:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.5 html5lib==1.1
      - run: python scripts/build_all.py
      - name: Export only generated public text changes for source review
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          names=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed={'data/search-index.json','data/achievement-map.json','data/achievements-public.json','sitemap.xml','updates.xml'}
          result={}
          for name in names:
              p=pathlib.Path(name)
              if (p.suffix=='.html' and '/' not in name) or name in allowed or name.startswith('cms-editor-manifests/'):
                  result[name]=p.read_text()
              else:
                  raise SystemExit('Unexpected generated output: '+name)
          pathlib.Path('public-content-generated.json').write_text(json.dumps(result,ensure_ascii=False))
          print('Generated public files:',len(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-content-generated
          path: public-content-generated.json
          retention-days: 7
