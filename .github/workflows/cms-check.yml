name: Standalone CMS checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['admin/**', 'scripts/publish_from_cms.py', 'tests/test_standalone_cms.py', '.github/workflows/cms-*.yml']
permissions:
  contents: read
jobs:
  cms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.13.5 html5lib==1.1
      - run: npm ci --ignore-scripts --prefix admin
      - run: npm run check --prefix admin
      - run: npm test --prefix admin
      - run: node admin/tests/integration.mjs
      - run: python -m unittest discover -s tests -p test_standalone_cms.py
      - run: npx --prefix admin wrangler deploy --config admin/wrangler.jsonc --dry-run --outdir /tmp/huiwen-cms-build
