name: Cloudflare public artifact QA
on:
  pull_request:
permissions:
  contents: read
jobs:
  static-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: python -m pip install beautifulsoup4==4.13.5 html5lib==1.1 'fonttools[woff]==4.66.1' brotli==1.2.0
      - name: Prepare artifact QA reports
        run: mkdir -p tests/donation/results/cloudflare-assets
      - name: Build and capture the single cold public artifact
        run: python scripts/build_cloudflare_public.py > tests/donation/results/cloudflare-assets/build.json
      - name: Report the measured CI cold and warm build times
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('tests/donation/results/cloudflare-assets/build.json').read_text())['artifactPageFonts']
          print(json.dumps({'compiler':data['compiler'],'candidateRoutes':data['candidateRoutes'],'cold':data['cold'],'warm':data['warm']},ensure_ascii=False))
          PY
      - name: Verify page-font contract negatives against the emitted artifact
        env:
          PAGE_FONT_ARTIFACT_ROOT: _site
          G02_BUILD_REPORT: tests/donation/results/cloudflare-assets/build.json
        run: python tests/page_font_artifact_integration.py
      - name: Verify immutable namespace and mutable manifest cache headers
        env:
          PAGE_FONT_ARTIFACT_ROOT: _site
        run: python -m unittest discover -s tests -p test_public_security_headers.py
      - run: npx --yes wrangler@4.143.1 deploy --dry-run --config wrangler.public.jsonc
      - name: Verify page-font failure report lifecycle
        run: node --unhandled-rejections=strict --test tests/donation/page-font-artifact-lifecycle.test.mjs tests/donation/page-font-artifact-network-gate.test.mjs tests/donation/page-font-artifact-preflight.test.mjs tests/donation/page-font-artifact-visual.test.mjs
      - run: npm ci --ignore-scripts --prefix tests/donation
      - name: Install Playwright Chromium with bounded official dependency retries
        run: bash scripts/install_playwright_ci.sh
      - name: Verify exact assets, existing routes and private-path exclusion
        run: |
          set -euo pipefail
          npx --yes wrangler@4.143.1 dev --local --config wrangler.public.jsonc --port 8789 > /tmp/wrangler-public.log 2>&1 &
          wrangler_pid=$!
          trap 'kill "$wrangler_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8789/deployment.json > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then cat /tmp/wrangler-public.log; exit 1; fi
          python scripts/verify_cloudflare_assets.py --base-url http://127.0.0.1:8789 --report tests/donation/results/cloudflare-assets/report.json
          python scripts/verify_security_headers.py --base-url http://127.0.0.1:8789 --artifact-root _site --report tests/donation/results/cloudflare-assets/security-headers.json
          BASE_URL=http://127.0.0.1:8789/ node tests/donation/page-font-artifact.mjs
          node --test tests/donation/service-worker-cache-policy.test.mjs
          BASE_URL=http://127.0.0.1:8789 node tests/donation/service-worker-artifact-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cloudflare-public-artifact-qa
          path: |
            tests/donation/results/cloudflare-assets/
            tests/donation/results/page-font-artifact/
            /tmp/wrangler-public.log
          retention-days: 14
