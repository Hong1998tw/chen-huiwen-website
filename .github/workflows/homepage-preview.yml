name: Review-only homepage preview
on:
  pull_request:
    paths:
      - 'tests/fixtures/homepage-preview/**'
      - 'tests/donation/homepage-preview.mjs'
      - '.github/workflows/homepage-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'preview/homepage-service-first-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix tests/donation
      - run: npx --prefix tests/donation playwright install chromium
      - run: node tests/donation/homepage-preview.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: homepage-preview-review
          retention-days: 14
          path: tests/donation/results/homepage-preview/
