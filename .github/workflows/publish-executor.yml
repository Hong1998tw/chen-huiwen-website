name: Notion publish executor (Pilot, PR-only)

# Disabled until the owner sets repository variable NOTION_PUBLISHER_ENABLED=true AND the
# notion-publisher environment (main-only) holds the Notion secret.
# Single-maintainer Pilot: use the job-scoped GITHUB_TOKEN only to create/update candidate
# branches and PRs. GitHub requires human approval before pull_request CI created by this token
# can run. This workflow never merges and never enables auto-merge; auto-merge is forbidden
# before 2026-11-29 (Asia/Taipei) and needs a separate explicit decision afterwards.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run | publish | verify | cycle | gate-check'
        type: choice
        options: [cycle, dry-run, publish, verify, gate-check]
        default: dry-run

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: publish-executor
  cancel-in-progress: false

jobs:
  executor:
    if: github.ref == 'refs/heads/main' && (vars.NOTION_PUBLISHER_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'gate-check' || inputs.mode == 'dry-run')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: notion-publisher
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install beautifulsoup4==4.13.5 html5lib==1.1

      - name: Run executor (no merge path exists)
        env:
          MODE: ${{ github.event_name == 'schedule' && 'cycle' || inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_PUBLISH_TOKEN }}
          NOTION_EVENTS_DS: ${{ vars.NOTION_EVENTS_DS }}
          NOTION_LEGAL_MONTH_DS: ${{ vars.NOTION_LEGAL_MONTH_DS }}
          NOTION_LEGAL_SESSION_DS: ${{ vars.NOTION_LEGAL_SESSION_DS }}
          PUBLISHER_GIT_NAME: ${{ vars.PUBLISHER_GIT_NAME }}
          PUBLISHER_GIT_EMAIL: ${{ vars.PUBLISHER_GIT_EMAIL }}
          PUBLISHER_SINGLE_MAINTAINER: ${{ vars.PUBLISHER_SINGLE_MAINTAINER }}
        run: python scripts/publish_from_notion.py "$MODE"
