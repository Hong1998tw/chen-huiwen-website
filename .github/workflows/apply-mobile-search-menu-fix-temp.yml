name: Apply mobile search menu fix temp
on:
  push:
    branches:
      - fix/mobile-search-menu-layout
    paths:
      - '.github/workflows/apply-mobile-search-menu-fix-temp.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-search-menu-layout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch mobile search placement and cache-bust assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          site = Path('site.js')
          text = site.read_text()
          marker = '// Mobile navigation owns the global search trigger at phone/tablet widths.'
          assert marker not in text
          text += """

// Mobile navigation owns the global search trigger at phone/tablet widths.
// Desktop keeps search beside the primary navigation; mobile keeps the header to logo + menu only.
(() => {
  const header = document.querySelector('.site-header .nav-wrap');
  const navigation = document.getElementById('navigation');
  const menuToggle = header?.querySelector('.menu-toggle');
  if (!header || !navigation || !menuToggle) return;
  const media = window.matchMedia('(max-width: 780px)');
  const placeSearch = () => {
    const trigger = document.querySelector('.global-search-trigger');
    if (!trigger) return false;
    if (media.matches) {
      if (trigger.parentElement !== navigation) navigation.prepend(trigger);
      trigger.classList.add('global-search-trigger--menu');
    } else {
      if (trigger.parentElement !== header) header.insertBefore(trigger, menuToggle);
      trigger.classList.remove('global-search-trigger--menu');
    }
    return true;
  };
  if (!placeSearch()) {
    const observer = new MutationObserver(() => {
      if (placeSearch()) observer.disconnect();
    });
    observer.observe(header, {childList:true, subtree:true});
  }
  media.addEventListener('change', placeSearch);
})();
"""
          site.write_text(text)

          mobile = Path('mobile.css')
          css = mobile.read_text()
          css_marker = '/* Mobile search belongs inside the opened navigation, never beside the menu pill. */'
          assert css_marker not in css
          css += """

/* Mobile search belongs inside the opened navigation, never beside the menu pill. */
@media(max-width:780px){
 .menu-ready .site-header nav>.global-search-trigger{grid-column:1/-1;position:static!important;right:auto!important;bottom:auto!important;width:100%!important;height:auto!important;min-height:52px;padding:12px 14px!important;justify-content:flex-start;border:0;border-radius:14px;background:var(--green-soft);box-shadow:none;font-size:.95rem}
 .menu-ready .site-header nav>.global-search-trigger span:nth-child(2){display:inline!important}
 .menu-ready .site-header nav>.global-search-trigger kbd{display:none!important}
}
"""
          mobile.write_text(css)

          targets = list(Path('.').glob('*.html')) + list(Path('templates').glob('*.html'))
          for path in targets:
              html = path.read_text()
              html = re.sub(r'site\.js\?v=[^"\']+', 'site.js?v=20260912-mobilemenu1', html)
              html = re.sub(r'mobile\.css\?v=[^"\']+', 'mobile.css?v=20260912-mobilemenu1', html)
              path.write_text(html)

          test = Path('tests/donation/digital-civic.mjs')
          t = test.read_text()
          anchor = "  await page.goto(base + 'achievements.html');\n"
          assert anchor in t
          check = """  await page.setViewportSize({ width: 390, height: 844 });
  await page.goto(base + 'index.html');
  await check('mobile header keeps search inside the opened menu', async () => {
    await page.waitForFunction(() => document.querySelector('.global-search-trigger'));
    const trigger = page.locator('.global-search-trigger');
    assert.equal(await trigger.evaluate(el => el.parentElement?.id), 'navigation');
    assert.equal(await trigger.isVisible(), false);
    const menu = page.getByRole('button', { name: /選單/ });
    await menu.click();
    await trigger.waitFor({ state: 'visible' });
    assert.equal(await trigger.evaluate(el => el.parentElement?.id), 'navigation');
    const menuBox = await menu.boundingBox();
    const searchBox = await trigger.boundingBox();
    assert(menuBox && searchBox);
    assert(searchBox.y > menuBox.y + menuBox.height);
  });
  await page.setViewportSize({ width: 1440, height: 960 });

"""
          test.write_text(t.replace(anchor, check + anchor))
          PY
      - name: Verify syntax and targeted contract
        run: |
          node --check site.js
          node --check tests/donation/digital-civic.mjs
          grep -q 'global-search-trigger--menu' site.js
          grep -q 'nav>.global-search-trigger' mobile.css
          grep -q 'site.js?v=20260912-mobilemenu1' index.html
          grep -q 'mobile.css?v=20260912-mobilemenu1' index.html
          ! grep -R 'site.js?v=20260912-publiccopy1' -- *.html templates/*.html
      - name: Commit fix
        run: |
          rm .github/workflows/apply-mobile-search-menu-fix-temp.yml
          git config user.name 'Hong1998tw'
          git config user.email '126787497+Hong1998tw@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: separate mobile search from menu trigger'
          git push origin HEAD:fix/mobile-search-menu-layout
