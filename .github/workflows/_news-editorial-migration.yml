name: Apply news editorial migration once

on:
  push:
    branches:
      - content/news-editorial-policy-20260910
    paths:
      - scripts/_apply_news_editorial_migration.py
      - .github/workflows/_news-editorial-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply editorial migration
        run: python scripts/_apply_news_editorial_migration.py
      - name: Validate and capture diagnostics
        id: validate
        shell: bash
        run: |
          set +e
          python scripts/validate_site.py > _news-editorial-validation.txt 2>&1
          status=$?
          cat _news-editorial-validation.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist diagnostics on validation failure
        if: steps.validate.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          git add _news-editorial-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: capture news editorial validation failure"
          git push origin HEAD:content/news-editorial-policy-20260910
          exit 1
      - name: Commit migrated source and remove one-time tooling
        if: steps.validate.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git rm -f _news-editorial-validation.txt scripts/_apply_news_editorial_migration.py .github/workflows/_news-editorial-migration.yml 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: align news cards with editorial policy"
          git push origin HEAD:content/news-editorial-policy-20260910
