name: Temporary Stage 2 latest-main sync

on:
  push:
    branches: [content/seo-migration-stage2]
    paths:
      - .github/workflows/stage2-sync-main.yml

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full branch history
        uses: actions/checkout@v4
        with:
          ref: content/seo-migration-stage2
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge latest main and resolve only expected news conflict
        shell: bash
        run: |
          git fetch origin main
          set +e
          git merge --no-edit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts: $conflicts"
            if [ "$conflicts" != "news.html" ]; then
              echo "Unexpected merge conflict set; refusing automatic resolution."
              exit 1
            fi
            git checkout --theirs news.html
            python - <<'PY'
          from pathlib import Path
          p=Path('news.html')
          s=p.read_text(encoding='utf-8')
          link='<a class="text-link" href="history-meilidao.html">美麗島事件與高雄民主記憶 →</a>'
          if link not in s:
              needle='<div class="work-links">'
              if needle not in s:
                  raise SystemExit('news.html work-links insertion point missing')
              s=s.replace(needle, needle+link, 1)
          p.write_text(s, encoding='utf-8')
          PY
            git add news.html
            git commit -m "merge: sync latest main before stage 2 release"
          else
            python - <<'PY'
          from pathlib import Path
          p=Path('news.html')
          s=p.read_text(encoding='utf-8')
          link='<a class="text-link" href="history-meilidao.html">美麗島事件與高雄民主記憶 →</a>'
          if link not in s:
              needle='<div class="work-links">'
              if needle not in s:
                  raise SystemExit('news.html work-links insertion point missing')
              s=s.replace(needle, needle+link, 1)
              p.write_text(s, encoding='utf-8')
          PY
            if ! git diff --quiet -- news.html; then
              git add news.html
              git commit -m "content: preserve history hub after main sync"
            fi
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install beautifulsoup4 html5lib

      - name: Rebuild generated content
        run: |
          python scripts/build_cases.py
          python scripts/build_platforms.py
          python scripts/build_events.py

      - name: Validate regenerated site
        run: |
          python -m json.tool data/achievements.json > /dev/null
          python scripts/validate_donation.py
          python scripts/validate_site.py
          git diff --check

      - name: Commit any deterministic generated changes
        shell: bash
        run: |
          git add achievements.html achievement-*.html vision.html activities.html
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate site after latest main sync"
          fi

      - name: Install browser QA dependencies
        run: |
          npm ci --prefix tests/donation
          npx --prefix tests/donation playwright install --with-deps chromium

      - name: Run full-site browser QA on merged state
        run: node tests/donation/browser.mjs

      - name: Push verified merged branch
        run: git push origin HEAD:content/seo-migration-stage2
