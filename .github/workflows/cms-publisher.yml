name: Standalone CMS publisher
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read only non-secret OIDC identity fields
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.parse
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote('https://huiwen-cms.lihong.workers.dev',safe='')
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req) as r: token=json.load(r)['value']
          part=token.split('.')[1]; claims=json.loads(base64.urlsafe_b64decode(part+'='*((4-len(part)%4)%4)))
          keys=['repository','repository_id','repository_owner_id','workflow_ref','ref','event_name','run_id']
          print(json.dumps({k:{'value':claims.get(k),'type':type(claims.get(k)).__name__} for k in keys}))
          print('No CMS request made; no token or private data persisted.')
          PY
