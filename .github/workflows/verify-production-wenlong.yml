name: Verify production Wenlong Lane 16

on:
  push:
    branches:
      - content/wenlong-lane16-20260910
    paths:
      - .github/workflows/verify-production-wenlong.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production content
        shell: bash
        run: |
          set -euo pipefail
          detail='https://www.huiwen.tw/achievement-wenlong-lane16.html'
          listing='https://www.huiwen.tw/achievements.html'
          ok=0
          for attempt in $(seq 1 12); do
            suffix="?verify=${GITHUB_RUN_ID}-${attempt}"
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${detail}${suffix}" -o /tmp/detail.html \
              && curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${listing}${suffix}" -o /tmp/listing.html \
              && grep -Fq '2026年7月15日14:30–15:30' /tmp/detail.html \
              && grep -Fq '2026年8月26日' /tmp/detail.html \
              && grep -Fq '1,400多萬元' /tmp/detail.html \
              && grep -Fq '持續追蹤' /tmp/detail.html \
              && grep -Fq '文龍路16巷路面改善整體規劃' /tmp/listing.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          ! grep -Fq '尚未找到可支持原敘述的第一手來源' /tmp/detail.html
          echo 'Production verification passed:'
          echo '- detail HTTP/content: PASS'
          echo '- 2026-07-15 14:30–15:30: PASS'
          echo '- 2026-08-26: PASS'
          echo '- 1,400多萬元: PASS'
          echo '- 持續追蹤: PASS'
          echo '- achievements listing: PASS'
