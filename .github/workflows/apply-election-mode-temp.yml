name: Apply election mode v1 temp
on:
  push:
    branches: [feat/election-mode-v1]
    paths: ['.github/workflows/apply-election-mode-temp.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/election-mode-v1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch election mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          R=Path('.')
          # New pages keep Political Donation as nav item #2, then Election.
          for name in ['election.html','press.html','facts.html']:
              p=R/name; s=p.read_text()
              s=s.replace('<a href="./">首頁</a><a href="election.html" aria-current="page">2026選舉</a><a href="political-donation.html">政治獻金</a>','<a href="./">首頁</a><a href="political-donation.html">政治獻金</a><a href="election.html" aria-current="page">2026選舉</a>')
              s=s.replace('<a href="./">首頁</a><a href="election.html">2026選舉</a><a href="political-donation.html">政治獻金</a>','<a href="./">首頁</a><a href="political-donation.html">政治獻金</a><a href="election.html">2026選舉</a>')
              p.write_text(s)

          # Election page key-date block.
          p=R/'election.html'; s=p.read_text()
          marker='</aside></div></section>\n<section class="wrap campaign-shell" aria-labelledby="campaign-nav-heading">'
          block='''</aside></div></section>\n<section class="wrap campaign-shell campaign-countdown-wrap" aria-labelledby="countdown-heading"><div class="campaign-countdown"><div><p class="campaign-kicker" id="countdown-heading">勝選倒數</p><strong id="campaign-countdown">—</strong> <span id="campaign-countdown-unit">天，距離投票日</span></div></div><div class="campaign-keydates"><div class="campaign-keydate" id="campaign-number-draw"><strong>2026/10/23</strong><span>候選人姓名號次抽籤</span><small>官方目前僅確認日期；時間／地點待最新公告</small></div><div class="campaign-keydate" id="campaign-vote-date"><strong>2026/11/28</strong><span>投開票</span><small>08:00–16:00，如有異動以中選會最新公告為準</small></div><p class="campaign-election-source" id="campaign-election-source">選務日期查核：2026-09-12 · <a href="https://web.cec.gov.tw/api/file/7d249f6a-cef3-48ce-a3b0-2857ae661f37.pdf" target="_blank" rel="noopener noreferrer">高雄市選舉委員會第175次委員會議紀錄 ↗</a></p></div></section>\n<section class="wrap campaign-shell" aria-labelledby="campaign-nav-heading">'''
          if marker not in s: raise SystemExit('election marker missing')
          p.write_text(s.replace(marker,block,1))

          # Homepage election mode.
          p=R/'index.html'; s=p.read_text()
          s=s.replace('<link rel="stylesheet" href="home.css?v=20260908-hours">','<link rel="stylesheet" href="home.css?v=20260908-hours">\n<link rel="stylesheet" href="campaign.css?v=20260912-1">\n<script src="campaign.js?v=20260912-1" defer></script>',1)
          s=s.replace('<a href="./" aria-current="page">首頁</a><a href="political-donation.html">政治獻金</a>','<a href="./" aria-current="page">首頁</a><a href="political-donation.html">政治獻金</a><a href="election.html">2026選舉</a>',1)
          marker='</section>\n<section class="wrap home-contact" aria-labelledby="contact-heading">'
          block='''</section>\n<section class="wrap campaign-entry" aria-labelledby="election-entry-heading"><div class="campaign-entry-head"><div><p class="eyebrow">2026 FENGSHAN</p><h2 id="election-entry-heading">2026 鳳山・選戰資訊模式</h2><p>政見、政績、市府回應、公開行程與新聞集中查找；每一項公開內容都保留來源邊界。</p></div><a class="button button-green" href="election.html">進入選舉資訊中心 →</a></div><div class="campaign-countdown-wrap"><div class="campaign-countdown"><div><p class="campaign-kicker">勝選倒數</p><strong id="campaign-countdown">—</strong> <span id="campaign-countdown-unit">天，距離投票日</span></div></div><div class="campaign-keydates"><div class="campaign-keydate" id="campaign-number-draw"><strong>2026/10/23</strong><span>候選人姓名號次抽籤</span><small>時間／地點以高雄市選委會後續公告為準</small></div><div class="campaign-keydate" id="campaign-vote-date"><strong>2026/11/28</strong><span>投開票</span><small>08:00–16:00</small></div><p class="campaign-election-source" id="campaign-election-source">官方選務時程：<a href="https://web.cec.gov.tw/api/file/7d249f6a-cef3-48ce-a3b0-2857ae661f37.pdf" target="_blank" rel="noopener noreferrer">高雄市選舉委員會 ↗</a></p></div></div><div class="campaign-quick-grid"><a class="campaign-quick-card" href="achievements.html"><strong>看政績</strong><span>地圖、里別、進度與來源</span></a><a class="campaign-quick-card" href="election.html#platforms"><strong>看 2026 政見</strong><span>依公開政見素材分類閱讀</span></a><a class="campaign-quick-card" href="election.html#tracking"><strong>慧文追蹤中</strong><span>提出、回應、辦理不混為完成</span></a><a class="campaign-quick-card" href="election.html#schedule"><strong>公開行程</strong><span>活動網址與加入行事曆</span></a><a class="campaign-quick-card" href="press.html"><strong>媒體專區</strong><span>新聞、照片與公開資料</span></a></div></section>\n<section class="wrap home-contact" aria-labelledby="contact-heading">'''
          if marker not in s: raise SystemExit('home marker missing')
          p.write_text(s.replace(marker,block,1))

          # Shared navigation and global search.
          p=R/'site.js'; s=p.read_text()
          old="  document.body.append(backdrop);\n  const links = [...navigation.querySelectorAll('a')];"
          new="""  document.body.append(backdrop);\n  if (!navigation.querySelector('a[href=\"election.html\"]')) {\n    const election = document.createElement('a'); election.href='election.html'; election.textContent='2026選舉';\n    const donation=navigation.querySelector('a[href=\"political-donation.html\"]');\n    if (donation) donation.after(election); else navigation.append(election);\n  }\n  const links = [...navigation.querySelectorAll('a')];"""
          if old not in s: raise SystemExit('site nav marker missing')
          p.write_text(s.replace(old,new,1).replace("const VERSION = '20260912-3';","const VERSION = '20260912-election1';"))
          p=R/'digital.js'; s=p.read_text().replace("const VERSION = '20260912-3';","const VERSION = '20260912-election1';")
          old="    ['首頁','./','服務處、問政與官網入口','頁面'],"
          new="""    ['首頁','./','服務處、問政與官網入口','頁面'],\n    ['2026選舉資訊','election.html','2026政見、慧文追蹤中、公開行程與選務日期','選舉'],\n    ['記者與媒體專區','press.html','新聞、人物資料、公開照片與媒體聯絡','媒體'],\n    ['資料查核與澄清','facts.html','查核方法、來源邊界與澄清入口','查核'],"""
          if old not in s: raise SystemExit('digital marker missing')
          p.write_text(s.replace(old,new,1))

          # Cache bust shared assets across source/generated HTML.
          for p in list(R.glob('*.html'))+list((R/'templates').glob('*.html')):
              s=p.read_text()
              s=re.sub(r'site\.js\?v=[^\"\']+','site.js?v=20260912-election1',s)
              s=re.sub(r'digital\.css\?v=[^\"\']+','digital.css?v=20260912-election1',s)
              s=re.sub(r'digital\.js\?v=[^\"\']+','digital.js?v=20260912-election1',s)
              s=re.sub(r'data-digital-civic=\"[^\"]+\"','data-digital-civic="20260912-election1"',s)
              p.write_text(s)

          # Sitemap and PWA.
          p=R/'sitemap.xml'; s=p.read_text(); marker='<url><loc>https://www.huiwen.tw/explore.html</loc><lastmod>2026-09-12</lastmod></url>'
          if 'https://www.huiwen.tw/election.html' not in s:
              s=s.replace(marker,marker+'\n<url><loc>https://www.huiwen.tw/election.html</loc><lastmod>2026-09-12</lastmod></url>\n<url><loc>https://www.huiwen.tw/press.html</loc><lastmod>2026-09-12</lastmod></url>\n<url><loc>https://www.huiwen.tw/facts.html</loc><lastmod>2026-09-12</lastmod></url>',1)
          p.write_text(s)
          p=R/'sw.js'; s=p.read_text(); s=re.sub(r"const CACHE='[^']+';","const CACHE='huiwen-digital-v3-20260912-election1';",s); s=re.sub(r"const SHELL=\[[^\n]+\];","const SHELL=['./','./index.html','./styles.css','./digital.css','./digital.js','./explore.html','./explore.js','./election.html','./press.html','./facts.html','./campaign.css','./campaign.js','./data/election-2026.json','./assets/favicon.svg'];",s); p.write_text(s)

          # CI and verification gates.
          p=R/'.github/workflows/donation-page-qa.yml'; s=p.read_text().replace('      - run: node --check tests/donation/digital-civic.mjs\n','      - run: node --check tests/donation/digital-civic.mjs\n      - run: node --check tests/donation/election-mode.mjs\n',1).replace('      - run: node tests/donation/digital-civic.mjs\n','      - run: node tests/donation/digital-civic.mjs\n      - run: node tests/donation/election-mode.mjs\n',1); p.write_text(s)
          p=R/'tests/donation/browser.mjs'; s=p.read_text(); old="      assert.equal(await page.locator('#navigation a').nth(1).getAttribute('href'),'political-donation.html');"; new="      assert.equal(await page.locator('#navigation a').nth(1).getAttribute('href'),'political-donation.html');\n      assert.equal(await page.locator('#navigation a[href=\"election.html\"]').count(),1);"; p.write_text(s.replace(old,new,1))
          p=R/'tests/donation/production-browser.mjs'; s=p.read_text(); s=s.replace("  'about.html',","  'about.html',\n  'election.html',\n  'press.html',\n  'facts.html',",1).replace("['index.html', 'achievements.html', 'news.html', 'service.html']","['index.html', 'election.html', 'achievements.html', 'news.html', 'service.html']"); p.write_text(s)
          p=R/'scripts/verify_production.py'; s=p.read_text().replace('    "about.html",','    "about.html",\n    "election.html",\n    "press.html",\n    "facts.html",',1).replace('STATIC_FILES = ("robots.txt", "sitemap.xml")','STATIC_FILES = ("robots.txt", "sitemap.xml", "data/election-2026.json")'); p.write_text(s)
          PY
      - name: Rebuild generated pages
        run: |
          python3 scripts/build_cases.py
          python3 scripts/build_events.py
          python3 scripts/build_platforms.py
      - name: Static checks
        run: |
          python3 -m py_compile scripts/build_cases.py scripts/build_events.py scripts/build_platforms.py scripts/verify_production.py
          node --check site.js && node --check digital.js && node --check campaign.js
          node --check tests/donation/election-mode.mjs && node --check tests/donation/digital-civic.mjs && node --check tests/donation/production-browser.mjs
          python3 -m json.tool data/election-2026.json >/dev/null
          python3 -m unittest discover -s tests/events
          pip install beautifulsoup4==4.13.5 html5lib==1.1
          python3 scripts/validate_site.py
          python3 scripts/validate_donation.py
          python3 scripts/validate_seo.py
      - name: Source contract
        run: |
          grep -q '勝選倒數' index.html
          grep -q '2026/10/23' election.html
          grep -q '2026/11/28' election.html
          grep -q '2026選舉資訊' digital.js
          grep -q 'election.html' sitemap.xml
          grep -q 'data/election-2026.json' sw.js
      - name: Commit integration
        run: |
          rm .github/workflows/apply-election-mode-temp.yml
          git config user.name 'Hong1998tw'
          git config user.email '126787497+Hong1998tw@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: launch 2026 election information mode'
          git push origin HEAD:feat/election-mode-v1
# retry-donation-nav-contract
