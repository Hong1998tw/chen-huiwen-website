name: Content freshness review

on:
  schedule:
    - cron: '35 0 * * *' # 08:35 Asia/Taipei; GitHub may delay scheduled runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-freshness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public content metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Restore previous observation for change-only alerts
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .freshness-cache/current.json
          key: content-freshness-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            content-freshness-v1-${{ github.ref_name }}-
      - name: Produce a read-only review report
        id: report
        run: |
          python scripts/check_content_freshness.py --previous-json .freshness-cache/current.json --output-json freshness-artifacts/report.json --output-markdown freshness-artifacts/report.md
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('freshness-artifacts/report.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('alert=' + str(report['alert']).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              if report['changed']:
                  stream.write(Path('freshness-artifacts/report.md').read_text())
              else:
                  stream.write('內容維護狀態未變；未重複告警。完整待辦保留於本次 report artifact。\n')
          target = Path('.freshness-cache/current.json')
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Save observation before evaluating new expiry alerts
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .freshness-cache/current.json
          key: content-freshness-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve public review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: content-freshness-${{ github.run_id }}
          path: freshness-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Flag only a new or changed expired finding
        if: steps.report.outputs.alert == 'true'
        run: |
          echo 'New or changed expired public content requires owner review. See the report artifact.'
          exit 1
