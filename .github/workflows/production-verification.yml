name: Production live verification

on:
  workflow_run:
    workflows: ['Cloudflare public delivery verification']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-live-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Prepare report directory
        run: mkdir -p tests/donation/results/production-live

      - name: Verify live HTTP semantics and canonical asset parity
        id: http
        continue-on-error: true
        run: >
          python scripts/verify_production.py
          --base-url https://www.huiwen.tw/
          --attempts 16
          --delay 15
          --timeout 20
          --report tests/donation/results/production-live/http-parity.json
          --snapshot-dir /tmp/huiwen-production-snapshot

      - name: Verify every reviewed public HTML page
        id: all_pages
        continue-on-error: true
        run: >
          python scripts/verify_all_pages.py
          --base-url https://www.huiwen.tw/
          --attempts 3
          --timeout 20
          --report tests/donation/results/production-live/all-pages.json

      - name: Install browser QA dependencies
        run: npm ci --ignore-scripts --prefix tests/donation

      - name: Install Chromium
        run: npx --prefix tests/donation playwright install --with-deps chromium

      - name: Run browser, responsive and accessibility QA against live production
        id: browser
        continue-on-error: true
        env:
          BASE_URL: https://www.huiwen.tw/
          LIVE_SNAPSHOT_DIR: /tmp/huiwen-production-snapshot
        run: node tests/donation/production-browser.mjs

      - name: Run direct browser-to-edge smoke without snapshot normalization
        id: native
        continue-on-error: true
        env:
          BASE_URL: https://www.huiwen.tw/
        run: node tests/donation/native-edge-smoke.mjs

      - name: Verify published consultation calendar and actual PNG downloads
        id: legal_card
        continue-on-error: true
        env:
          LEGAL_LIVE_URL: https://www.huiwen.tw/
        run: node tests/donation/legal-calendar.mjs

      - name: Verify published homepage sources and responsive interactions
        id: home_design
        continue-on-error: true
        env:
          HOME_LIVE_URL: https://www.huiwen.tw/
        run: node tests/donation/homepage-production.mjs

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-live-verification
          path: |
            tests/donation/results/production-live/
            tests/donation/results/native-edge/
            tests/donation/results/legal-calendar/
            tests/donation/results/homepage-production/
            tests/donation/results/*.json
            tests/donation/results/*.png

      - name: Fail production verification when a check failed
        if: ${{ always() && (steps.http.outcome != 'success' || steps.all_pages.outcome != 'success' || steps.browser.outcome != 'success' || steps.native.outcome != 'success' || steps.legal_card.outcome != 'success' || steps.home_design.outcome != 'success') }}
        run: |
          echo "HTTP production verification outcome: ${{ steps.http.outcome }}"
          echo "All public pages outcome: ${{ steps.all_pages.outcome }}"
          echo "Live production browser QA outcome: ${{ steps.browser.outcome }}"
          echo "Native edge QA outcome: ${{ steps.native.outcome }} (BLOCKED is not PASS)"
          echo "Published monthly card download outcome: ${{ steps.legal_card.outcome }}"
          echo "Published homepage design outcome: ${{ steps.home_design.outcome }}"
          echo "Independent Production Verification failed or blocked; inspect reports."
          exit 1
