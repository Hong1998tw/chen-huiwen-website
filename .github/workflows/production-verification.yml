name: Production live verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-live-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare report directory
        run: mkdir -p tests/donation/results/production-live

      - name: Verify live HTTP semantics and canonical asset parity
        id: http
        continue-on-error: true
        run: >
          python scripts/verify_production.py
          --base-url https://www.huiwen.tw/
          --attempts 16
          --delay 15
          --timeout 20
          --report tests/donation/results/production-live/http-parity.json

      - name: Install browser QA dependencies
        run: npm ci --prefix tests/donation

      - name: Install Chromium
        run: npx --prefix tests/donation playwright install --with-deps chromium

      - name: Run browser, responsive and accessibility QA on canonical deployed commit
        id: browser
        continue-on-error: true
        run: node tests/donation/browser.mjs

      - name: Upload production verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-live-verification
          path: |
            tests/donation/results/production-live/
            tests/donation/results/*.json
            tests/donation/results/*.png

      - name: Fail production verification when a check failed
        if: ${{ always() && (steps.http.outcome != 'success' || steps.browser.outcome != 'success') }}
        run: |
          echo "HTTP production verification outcome: ${{ steps.http.outcome }}"
          echo "Canonical browser QA outcome: ${{ steps.browser.outcome }}"
          echo "Independent Production Verification failed."
          exit 1
