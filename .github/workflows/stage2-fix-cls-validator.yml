name: Temporary Stage 2 CLS validator correction

on:
  push:
    branches: [content/seo-migration-stage2]
    paths:
      - .github/workflows/stage2-fix-cls-validator.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/seo-migration-stage2
      - name: Correct CLS aggregation to current Core Web Vitals definition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/donation/browser.mjs')
          s = p.read_text(encoding='utf-8')
          old_observer = """      window.layoutShifts=[];\n      new PerformanceObserver(list=>{for(const entry of list.getEntries())if(!entry.hadRecentInput)window.layoutShifts.push(entry.value)}).observe({type:'layout-shift',buffered:true});"""
          new_observer = """      window.layoutShifts=[];\n      new PerformanceObserver(list=>{\n        for(const entry of list.getEntries()) {\n          if(!entry.hadRecentInput) window.layoutShifts.push({value:entry.value,startTime:entry.startTime});\n        }\n      }).observe({type:'layout-shift',buffered:true});"""
          old_calc = """          const cls=await page.evaluate(()=>window.layoutShifts.reduce((a,b)=>a+b,0));"""
          new_calc = """          const cls=await page.evaluate(()=>{\n            // Current Core Web Vitals CLS is the largest session window, not the legacy lifetime sum.\n            // A session window allows gaps under 1s and lasts at most 5s.\n            const shifts=[...window.layoutShifts].sort((a,b)=>a.startTime-b.startTime);\n            let max=0,current=0,windowStart=0,last=0;\n            for(const entry of shifts){\n              if(current>0 && entry.startTime-last<1000 && entry.startTime-windowStart<=5000){\n                current+=entry.value;\n              }else{\n                current=entry.value;\n                windowStart=entry.startTime;\n              }\n              last=entry.startTime;\n              max=Math.max(max,current);\n            }\n            return max;\n          });"""
          if s.count(old_observer) != 1:
              raise SystemExit(f'observer pattern count={s.count(old_observer)}')
          if s.count(old_calc) != 1:
              raise SystemExit(f'calculation pattern count={s.count(old_calc)}')
          s = s.replace(old_observer, new_observer).replace(old_calc, new_calc)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit validator correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/donation/browser.mjs
          git commit -m "test: measure CLS with current session-window metric"
          git push origin HEAD:content/seo-migration-stage2
