name: Public activity schedule QA
on:
  pull_request:
permissions:
  contents: read
jobs:
  activity-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.5 html5lib==1.1
      - run: python scripts/build_all.py
      - name: Preserve deterministic generation evidence
        run: |
          mkdir -p /tmp/activity-generated
          git diff --name-only -- '*.html' 'data/*.json' 'sitemap.xml' 'updates.xml' > /tmp/activity-generated/changed-files.txt
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          out=Path('/tmp/activity-generated')
          changed=(out/'changed-files.txt').read_text().splitlines()
          for name in changed:
              target=out/name
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(name,target)
          (out/'manifest.json').write_text(json.dumps({'changed':changed},indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: activity-generated-evidence
          path: /tmp/activity-generated/
          retention-days: 14
      - run: python -m unittest discover -s tests -p test_event_optional_end.py
      - run: npm ci --ignore-scripts --prefix tests/donation
      - run: npx --prefix tests/donation playwright install --with-deps chromium
      - run: node tests/donation/events.mjs
      - name: Require committed generated outputs
        run: git diff --exit-code -- '*.html' 'data/*.json' 'sitemap.xml' 'updates.xml'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-activity-schedule-qa
          path: tests/donation/results/events/
          retention-days: 14
