name: Finalize mobile search menu temp
on:
  push:
    branches:
      - fix/mobile-search-menu-layout
    paths:
      - '.github/workflows/finalize-mobile-search-menu-temp.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-search-menu-layout
      - name: Finalize interaction and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          site = Path('site.js')
          text = site.read_text()
          old = "navigation.addEventListener('click', event => { if (event.target.closest('a')) closeMenu(); });"
          new = "navigation.addEventListener('click', event => { if (event.target.closest('a') || event.target.closest('.global-search-trigger')) closeMenu(); });"
          assert text.count(old) == 1
          site.write_text(text.replace(old, new))

          test = Path('tests/donation/digital-civic.mjs')
          text = test.read_text()
          old = "    const menu = page.getByRole('button', { name: /選單/ });\n    await menu.click();\n    await trigger.waitFor({ state: 'visible' });\n    assert.equal(await trigger.evaluate(el => el.parentElement?.id), 'navigation');\n    const menuBox = await menu.boundingBox();\n    const searchBox = await trigger.boundingBox();\n    assert(menuBox && searchBox);\n    assert(searchBox.y > menuBox.y + menuBox.height);"
          new = "    const menu = page.locator('.menu-toggle');\n    await menu.click();\n    await trigger.waitFor({ state: 'visible' });\n    assert.equal(await trigger.evaluate(el => el.parentElement?.id), 'navigation');\n    const menuBox = await menu.boundingBox();\n    const searchBox = await trigger.boundingBox();\n    assert(menuBox && searchBox);\n    assert(searchBox.y > menuBox.y + menuBox.height);\n    await trigger.click();\n    await page.locator('#global-search-dialog').waitFor({ state: 'visible' });\n    assert.equal(await page.locator('#navigation').evaluate(el => el.classList.contains('is-open')), false);\n    await page.keyboard.press('Escape');"
          assert text.count(old) == 1
          test.write_text(text.replace(old, new))
          PY
          node --check site.js
          node --check tests/donation/digital-civic.mjs
      - name: Commit
        run: |
          rm .github/workflows/finalize-mobile-search-menu-temp.yml
          git config user.name 'Hong1998tw'
          git config user.email '126787497+Hong1998tw@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: verify mobile menu search interaction'
          git push origin HEAD:fix/mobile-search-menu-layout
