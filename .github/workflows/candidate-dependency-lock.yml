name: Generate reviewed canonical projections

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate-projections:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/huiwen-site-admin-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.5 html5lib==1.1
      - name: Generate and export canonical changes without pushing
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/build_all.py
          mkdir -p projection-evidence
          git diff --stat > projection-evidence/diff-stat.txt
          git diff --binary > projection-evidence/generated.patch
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          paths = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          files = {}
          for name in paths:
              path = pathlib.Path(name)
              if not (name.endswith('.html') or name in {'data/achievements-public.json','data/achievement-map.json','data/search-index.json','sitemap.xml','updates.xml'}):
                  raise SystemExit('Unexpected builder output: '+name)
              content = path.read_text(encoding='utf-8')
              files[name] = {'content':content,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          pathlib.Path('projection-evidence/generated.json').write_text(json.dumps({'sourceHead':os.environ['SOURCE_HEAD'],'files':files},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python scripts/quality.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-projections-${{ github.event.pull_request.head.sha }}
          path: projection-evidence/
          if-no-files-found: error
          retention-days: 7
