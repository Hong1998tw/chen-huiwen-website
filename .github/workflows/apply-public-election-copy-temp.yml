name: Apply public election copy temp
on:
  push:
    branches:
      - fix/public-election-copy-v2
    paths:
      - '.github/workflows/apply-public-election-copy-temp.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-election-copy-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and apply source patch
        run: |
          cat .tmp/public-election-patch/part* | base64 -d > "$RUNNER_TEMP/public-election-copy.patch.xz"
          xz -dc "$RUNNER_TEMP/public-election-copy.patch.xz" > "$RUNNER_TEMP/public-election-copy.patch"
          git apply --check "$RUNNER_TEMP/public-election-copy.patch"
          git apply "$RUNNER_TEMP/public-election-copy.patch"
          rm -f facts.html press.html
      - name: Rebuild generated pages
        run: |
          python3 scripts/build_cases.py
          python3 scripts/build_events.py
          python3 scripts/build_platforms.py
      - name: Syntax and unit checks
        run: |
          python3 -m py_compile scripts/build_cases.py scripts/build_events.py scripts/build_platforms.py scripts/validate_site.py scripts/verify_production.py
          python3 -m unittest discover -s tests/events
          node --check campaign.js
          node --check digital.js
          node --check explore.js
          node --check site.js
          node --check tests/donation/browser.mjs
          node --check tests/donation/digital-civic.mjs
          node --check tests/donation/election-mode.mjs
          node --check tests/donation/production-browser.mjs
      - name: Static validators
        run: |
          pip install beautifulsoup4==4.13.5 html5lib==1.1
          python3 scripts/validate_site.py
          python3 scripts/validate_donation.py
          python3 scripts/validate_seo.py
      - name: Public-facing contract checks
        run: |
          test "$(find . -maxdepth 1 -name 'achievement-*.html' | wc -l)" -eq 20
          grep -q '公開行程與活動' activities.html
          grep -q '勝選倒數' index.html
          grep -q '候選人姓名號次抽籤' index.html
          grep -q '投票日' index.html
          ! grep -q 'campaign-quick-grid' index.html
          ! grep -q 'campaign-quick-grid' election.html
          ! grep -q '慧文追蹤中' election.html
          ! grep -q '媒體專區' election.html
          test ! -e facts.html
          test ! -e press.html
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text()
          assert text.index('政治獻金專戶') < text.index('有事找慧文')
          forbidden=['待核驗','資料核驗狀態','資料查核','來源邊界','不混為完成','正式選舉公報尚未取得','已收到並核對']
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              for word in forbidden:
                  assert word not in s, f'{p}: {word}'
          PY
      - name: Commit source and generated output
        run: |
          rm -rf .tmp/public-election-patch
          git config user.name 'Hong1998tw'
          git config user.email '126787497+Hong1998tw@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: simplify election mode public copy'
          git push origin HEAD:fix/public-election-copy-v2
