<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>慧文政績島｜陳慧文</title>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.huiwen.tw/island/">
  <meta property="og:title" content="慧文政績島｜陳慧文">
  <meta property="og:description" content="做得到的承諾，看得見的改變。陳慧文 2026 政見與鳳山政績，一座一座島看清楚。">
  <meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#075548">

<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./dot-life.css">
<link rel="stylesheet" href="./dot-longlong-dialogue.css">
  <link rel="stylesheet" href="./dot-code-2/dot-code-2.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<main id="app">
  <div id="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <p class="loading-title">慧文政績島</p>
      <div class="loading-track"><div id="loading-bar"></div></div>
      <p id="loading-text">小島建造中⋯</p>
    </div>
  </div>
  <noscript><p class="noscript">這座 3D 島需要開啟 JavaScript 才能瀏覽。</p></noscript>
  <canvas id="scene" aria-label="慧文政績島立體地圖"></canvas>
  <div id="labels" aria-label="各島名稱"></div>
  <div id="tooltip" role="status"></div>
  <div id="citylog" aria-live="polite"></div>

  <header class="brand">
    <p class="brand-name">慧文政績島</p>
    <h1><span>慧文會武</span><span>會做事</span></h1>
    <p class="brand-sub">懂建設、會爭取</p>
  </header>

  <nav class="toolbar" aria-label="地圖操作">
    <button type="button" id="btn-home">全景</button>
    <button type="button" id="btn-night" aria-pressed="false">夜晚</button>
    <button type="button" id="btn-names" aria-pressed="true">名牌</button>
    <button type="button" id="btn-explore" aria-expanded="false">探索</button>
    <button type="button" id="btn-list" aria-expanded="true" aria-controls="panel">清單</button>
  </nav>

  <aside id="panel" aria-label="政見與政績清單">
    <div class="panel-handle" aria-hidden="true"></div>
    <div id="panel-body"></div>
  </aside>

  <div id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" hidden>
    <div class="intro-card">
      <p class="intro-step" id="intro-step">1／3</p>
      <h2 id="intro-title"></h2>
      <p id="intro-text"></p>
      <div class="intro-actions">
        <button type="button" class="ghost" id="intro-skip">略過</button>
        <button type="button" class="primary" id="intro-next">下一步</button>
      </div>
    </div>
  </div>

  <noscript><p class="noscript">這個頁面需要開啟 JavaScript。完整政績請見 <a href="https://www.huiwen.tw/achievements.html">慧文官網</a>。</p></noscript>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
